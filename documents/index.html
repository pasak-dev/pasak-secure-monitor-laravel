```bash\r\n  php artisan pasak:baseline --force\r\n  ```\r\n  Ini mengunci hash berkas inti resmi (`app\/`, `config\/`, `routes\/`, `public\/index.php`, `bootstrap\/app.php`).\r\n\r\n---\r\n\r\n## 3. Hak Akses Berkas & Direktori (Permissions)\r\n\r\nTerapkan prinsip *Least Privilege* pada sistem operasi Linux:\r\n```bash\r\n# Berikan kepemilikan kepada pengguna web server\r\nsudo chown -R www-data:www-data \/var\/www\/aplikasi-anda\r\n\r\n# Setel izin direktori standar (755) dan berkas (644)\r\nfind \/var\/www\/aplikasi-anda -type d -exec chmod 755 {} \\;\r\nfind \/var\/www\/aplikasi-anda -type f -exec chmod 644 {} \\;\r\n\r\n# Folder storage dan cache WAJIB writable (775)\r\nchmod -R 775 \/var\/www\/aplikasi-anda\/storage\r\nchmod -R 775 \/var\/www\/aplikasi-anda\/bootstrap\/cache\r\n```\r\n\r\n---\r\n\r\n## 4. Crontab & Otomasi Pemeliharaan\r\n\r\n- [ ] Pastikan cron runner Laravel berjalan setiap menit:\r\n  ```bash\r\n  * * * * * cd \/var\/www\/aplikasi-anda && php artisan schedule:run >> \/dev\/null 2>&1\r\n  ```\r\n- [ ] Pastikan cron pembersih log usang harian aktif (`pasak:prune-logs` pada jam 02:30).\r\n\r\n---\r\n\r\n## 5. Web Server Nginx Hardening\r\n\r\n- [ ] Salin template `nginx.conf` yang telah dipublikasikan ke `\/etc\/nginx\/sites-available\/`.\r\n- [ ] Pastikan dua direktif `limit_req_zone` diletakkan di dalam blok `http { ... }`.\r\n- [ ] Sesuaikan path socket PHP-FPM (`\/var\/run\/php\/php8.3-fpm.sock` atau sesuai versi PHP server).\r\n- [ ] Jika berada di balik Reverse Proxy \/ Cloudflare, aktifkan direktif `set_real_ip_from` dan `real_ip_recursive on;`.\r\n- [ ] Pastikan `server_tokens off;` aktif untuk menyembunyikan versi Nginx.\r\n- [ ] Jalankan uji sintaks Nginx:\r\n  ```bash\r\n  sudo nginx -t\r\n  ```\r\n- [ ] Reload Nginx:\r\n  ```bash\r\n  sudo systemctl reload nginx\r\n  ```\r\n\r\n---\r\n\r\n## 6. Prosedur Darurat Buka Blokir (Emergency Runbook)\r\n\r\nJika karena suatu insiden tak terduga, IP kantor pusat atau IP pimpinan terblokir oleh WAF:\r\n1. Hubungkan ke server melalui SSH.\r\n2. Jalankan perintah unblock instan:\r\n   ```bash\r\n   php artisan pasak:unblock-ip 103.11.22.33\r\n   ```\r\n   Atau jika darurat skala luas:\r\n   ```bash\r\n   php artisan pasak:unblock-ip --all\r\n   ```\r\n3. Tambahkan IP tersebut ke variabel `PASAK_IP_WHITELIST` di berkas `.env` agar tidak terulang kembali.\r\n"},{"section":"07-integration-guides","filename":"01-frontend-react-inertia.md","title":"01. Integrasi Frontend React \/ Inertia","content":"# 01. Integrasi Frontend React \/ Inertia\r\n\r\nKarena **`pasak-dev\/secure-monitor`** dirancang secara **Headless (Pure REST API)**, Anda dapat membangun antarmuka dashboard keamanan dan penanganan error pemblokiran menggunakan React dan Inertia.js sesuai kebutuhan desain aplikasi Anda.\r\n\r\n---\r\n\r\n## 1. Menangani Respons HTTP 403 Terblokir (Axios Interceptor)\r\n\r\nKetika pengguna terblokir oleh WAF, setiap panggilan API atau request Inertia akan mengembalikan kode status **HTTP 403 Forbidden** dengan struktur JSON:\r\n\r\n```json\r\n{\r\n    \"success\": false,\r\n    \"message\": \"Akses ditolak. Alamat IP atau perangkat Anda diblokir...\",\r\n    \"reason\": \"Percobaan Server-Side Template Injection (SSTI)\",\r\n    \"reference_id\": \"SEC-A1B2C3D4\",\r\n    \"blocked\": true\r\n}\r\n```\r\n\r\nAnda dapat menangani respons ini secara global menggunakan Axios interceptor:\r\n\r\n```javascript\r\n\/\/ resources\/js\/lib\/axios.js\r\nimport axios from \"axios\";\r\n\r\nconst api = axios.create({\r\n    baseURL: \"\/api\",\r\n});\r\n\r\napi.interceptors.response.use(\r\n    (response) => response,\r\n    (error) => {\r\n        if (\r\n            error.response &&\r\n            error.response.status === 403 &&\r\n            error.response.data?.blocked\r\n        ) {\r\n            \/\/ Simpan detail blokir ke state manager \/ trigger modal permohonan banding\r\n            window.dispatchEvent(\r\n                new CustomEvent(\"security-blocked\", {\r\n                    detail: error.response.data,\r\n                }),\r\n            );\r\n        }\r\n        return Promise.reject(error);\r\n    },\r\n);\r\n\r\nexport default api;\r\n```\r\n\r\n---\r\n\r\n## 2. Komponen Modal Pengajuan Tiket Banding (Appeal Modal)\r\n\r\n```tsx\r\n\/\/ resources\/js\/Components\/AppealTicketModal.tsx\r\nimport React, { useState } from \"react\";\r\nimport axios from \"axios\";\r\n\r\ninterface BlockedData {\r\n    reference_id: string;\r\n    reason: string;\r\n    ip_address: string;\r\n}\r\n\r\nexport const AppealTicketModal: React.FC<{\r\n    data: BlockedData;\r\n    onClose: () => void;\r\n}> = ({ data, onClose }) => {\r\n    const [form, setForm] = useState({\r\n        name: \"\",\r\n        email: \"\",\r\n        phone: \"\",\r\n        reason: \"\",\r\n    });\r\n    const [ticketNumber, setTicketNumber] = useState<string | null>(null);\r\n    const [loading, setLoading] = useState(false);\r\n    const [errorMsg, setErrorMsg] = useState<string | null>(null);\r\n\r\n    const handleSubmit = async (e: React.FormEvent) => {\r\n        e.preventDefault();\r\n        setLoading(true);\r\n        setErrorMsg(null);\r\n\r\n        try {\r\n            const res = await axios.post(\r\n                \"\/api\/pasak\/unblock-tickets\/submit\",\r\n                {\r\n                    ...form,\r\n                    reason: `[Ref: ${data.reference_id}] ${form.reason}`,\r\n                },\r\n            );\r\n            setTicketNumber(res.data.ticket_number);\r\n        } catch (err: any) {\r\n            setErrorMsg(\r\n                err.response?.data?.message || \"Gagal mengirimkan permohonan.\",\r\n            );\r\n        } finally {\r\n            setLoading(false);\r\n        }\r\n    };\r\n\r\n    if (ticketNumber) {\r\n        return (\r\n            <div className=\"p-6 bg-white dark:bg-gray-900 rounded-lg shadow-xl max-w-md mx-auto text-center\">\r\n                <h3 className=\"text-xl font-bold text-green-600 mb-2\">\r\n                    Permohonan Berhasil Dikirim!\r\n                <\/h3>\r\n                <p className=\"text-sm text-gray-600 dark:text-gray-400 mb-4\">\r\n                    Nomor tiket permohonan banding Anda adalah:\r\n                <\/p>\r\n                <div className=\"p-3 bg-gray-100 dark:bg-gray-800 rounded font-mono font-bold text-lg select-all\">\r\n                    {ticketNumber}\r\n                <\/div>\r\n                <p className=\"text-xs text-gray-500 mt-4\">\r\n                    Simpan nomor ini untuk memeriksa status pembukaan blokir\r\n                    secara berkala.\r\n                <\/p>\r\n                <button\r\n                    onClick={onClose}\r\n                    className=\"mt-4 px-4 py-2 bg-blue-600 text-white rounded\"\r\n                >\r\n                    Tutup\r\n                <\/button>\r\n            <\/div>\r\n        );\r\n    }\r\n\r\n    return (\r\n        <form\r\n            onSubmit={handleSubmit}\r\n            className=\"p-6 bg-white dark:bg-gray-900 rounded-lg shadow-xl max-w-lg mx-auto space-y-4\"\r\n        >\r\n            <h2 className=\"text-lg font-bold text-red-600\">\r\n                Akses Dibatasi — Ajukan Permohonan Buka Blokir\r\n            <\/h2>\r\n            <p className=\"text-xs text-gray-500\">\r\n                ID Referensi: <strong>{data.reference_id}<\/strong> (IP:{\" \"}\r\n                {data.ip_address})\r\n            <\/p>\r\n\r\n            {errorMsg && (\r\n                <div className=\"p-2 bg-red-100 text-red-700 text-xs rounded\">\r\n                    {errorMsg}\r\n                <\/div>\r\n            )}\r\n\r\n            <div>\r\n                <label className=\"block text-xs font-medium\">\r\n                    Nama Lengkap\r\n                <\/label>\r\n                <input\r\n                    required\r\n                    type=\"text\"\r\n                    className=\"w-full border p-2 rounded text-sm\"\r\n                    value={form.name}\r\n                    onChange={(e) => setForm({ ...form, name: e.target.value })}\r\n                \/>\r\n            <\/div>\r\n            <div>\r\n                <label className=\"block text-xs font-medium\">\r\n                    Email Kerja \/ Aktif\r\n                <\/label>\r\n                <input\r\n                    required\r\n                    type=\"email\"\r\n                    className=\"w-full border p-2 rounded text-sm\"\r\n                    value={form.email}\r\n                    onChange={(e) =>\r\n                        setForm({ ...form, email: e.target.value })\r\n                    }\r\n                \/>\r\n            <\/div>\r\n            <div>\r\n                <label className=\"block text-xs font-medium\">\r\n                    Alasan \/ Klarifikasi Aktivitas\r\n                <\/label>\r\n                <textarea\r\n                    required\r\n                    rows={3}\r\n                    className=\"w-full border p-2 rounded text-sm\"\r\n                    value={form.reason}\r\n                    onChange={(e) =>\r\n                        setForm({ ...form, reason: e.target.value })\r\n                    }\r\n                    placeholder=\"Jelaskan aktivitas apa yang sedang Anda lakukan...\"\r\n                \/>\r\n            <\/div>\r\n            <button\r\n                type=\"submit\"\r\n                disabled={loading}\r\n                className=\"w-full py-2 bg-blue-600 text-white rounded font-medium hover:bg-blue-700 transition\"\r\n            >\r\n                {loading ? \"Mengirim...\" : \"Kirim Permohonan Banding\"}\r\n            <\/button>\r\n        <\/form>\r\n    );\r\n};\r\n```\r\n\r\n---\r\n\r\n## 3. Membangun Dashboard React Kustom via Headless REST API\r\n\r\nDashboard bawaan Pasak adalah **Blade murni**. Bila aplikasi host Anda memakai React\/Inertia dan membutuhkan panel monitoring dalam stack tersebut, bangun halaman kustom yang mengonsumsi **headless REST API** (`\/api\/security\/*`) — seluruh operasi admin (logs, blocked-ips, server audit, sessions, tickets) tersedia sebagai endpoint JSON yang didokumentasikan di [REST API Reference](..\/..\/04-rest-api-reference\/01-api-overview.md).\r\n\r\nContoh kerangka fetch (admin, memakai cookie sesi Laravel):\r\n\r\n```tsx\r\nconst res = await fetch('\/api\/security\/logs?per_page=15', {\r\n    headers: { Accept: 'application\/json' },\r\n});\r\nconst { data } = await res.json();\r\n```\r\n\r\n> 🔒 Endpoint admin dilindungi middleware `auth` + `pasak.admin` (Gate `manage-pasak`).\r\n\r\n### Menambahkan Tautan di Sidebar\r\n\r\nUntuk memunculkan tautan ke panel Blade bawaan (`\/pasak`) atau dashboard React kustom Anda, tambahkan item berikut ke `mainNavItems` pada `resources\/js\/components\/app-sidebar.tsx`:\r\n\r\n```tsx\r\nimport { ShieldCheck } from 'lucide-react';\r\n\r\n{\r\n    title: 'Security Monitor',\r\n    href: '\/pasak',\r\n    icon: ShieldCheck,\r\n},\r\n```\r\n"},{"section":"07-integration-guides","filename":"02-frontend-blade-livewire.md","title":"02. Integrasi Frontend Blade","content":"# 02. Integrasi Frontend Blade\r\n\r\nJika aplikasi host Anda menggunakan template berbasis Blade, integrasi dengan **`pasak-dev\/secure-monitor`** sangat cepat dan intuitif — dashboard paket adalah Blade murni (100% Pure PHP) sehingga jalan di semua aplikasi Laravel tanpa Livewire\/Inertia\/Vue.\r\n\r\n---\r\n\r\n## 1. Menyesuaikan Halaman Tampilan Blokir (`errors.blocked`)\r\n\r\nJika request bukan panggilan JSON API, middleware `BlockIpAddress` secara otomatis memeriksa apakah berkas view Blade `errors.blocked` tersedia di aplikasi Anda (`resources\/views\/errors\/blocked.blade.php`).\r\n\r\nJika ada, paket akan me-render view tersebut dengan meneruskan variabel:\r\n\r\n- `$ip`: Alamat IP klien yang diblokir.\r\n- `$deviceId`: Fingerprint perangkat klien (jika ada).\r\n- `$localIp`: IP lokal klien.\r\n- `$reason`: Alasan pemblokiran (nama aturan atau catatan admin).\r\n- `$message`: Pesan deskriptif.\r\n- `$referenceId`: ID referensi unik (misal: `SEC-9A8B7C6D`).\r\n- `$supportEmail`: Alamat email bantuan dari konfigurasi.\r\n\r\n### Contoh Template Blade Cantik: `resources\/views\/errors\/blocked.blade.php`\r\n\r\n```blade\r\n<!DOCTYPE html>\r\n<html lang=\"id\">\r\n<head>\r\n    <meta charset=\"utf-8\">\r\n    <meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\r\n    <title>403 - Akses Ditolak | Sistem Keamanan<\/title>\r\n    <style>\r\n        body { font-family: -apple-system, BlinkMacSystemFont, \"Segoe UI\", Roboto, sans-serif; background: #0f172a; color: #f8fafc; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; padding: 20px; box-sizing: border-box; }\r\n        .card { background: #1e293b; border: 1px solid #334155; border-radius: 12px; max-width: 520px; width: 100%; padding: 32px; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5); }\r\n        .badge { display: inline-block; background: #ef4444; color: #fff; font-size: 12px; font-weight: bold; padding: 4px 10px; border-radius: 9999px; text-transform: uppercase; margin-bottom: 16px; }\r\n        h1 { font-size: 22px; margin: 0 0 12px 0; color: #f1f5f9; }\r\n        p { font-size: 14px; line-height: 1.6; color: #94a3b8; margin: 0 0 20px 0; }\r\n        .meta-box { background: #0f172a; border-radius: 8px; padding: 16px; margin-bottom: 24px; font-family: monospace; font-size: 13px; }\r\n        .meta-row { display: flex; justify-content: space-between; margin-bottom: 8px; }\r\n        .meta-row:last-child { margin-bottom: 0; }\r\n        .meta-label { color: #64748b; }\r\n        .meta-value { color: #38bdf8; font-weight: bold; }\r\n        .btn { display: block; width: 100%; text-align: center; background: #2563eb; color: #fff; text-decoration: none; padding: 12px; border-radius: 8px; font-weight: 600; font-size: 14px; transition: background 0.2s; }\r\n        .btn:hover { background: #1d4ed8; }\r\n        .footer { font-size: 12px; text-align: center; color: #64748b; margin-top: 20px; }\r\n    <\/style>\r\n<\/head>\r\n<body>\r\n    <div class=\"card\">\r\n        <span class=\"badge\">Akses Ditolak (403)<\/span>\r\n        <h1>Perlindungan Keamanan Aktif<\/h1>\r\n        <p>{{ $message }}<\/p>\r\n\r\n        <div class=\"meta-box\">\r\n            <div class=\"meta-row\">\r\n                <span class=\"meta-label\">ID Referensi:<\/span>\r\n                <span class=\"meta-value\">{{ $referenceId }}<\/span>\r\n            <\/div>\r\n            <div class=\"meta-row\">\r\n                <span class=\"meta-label\">Alamat IP:<\/span>\r\n                <span class=\"meta-value\">{{ $ip }}<\/span>\r\n            <\/div>\r\n            <div class=\"meta-row\">\r\n                <span class=\"meta-label\">Indikasi:<\/span>\r\n                <span class=\"meta-value\" style=\"color: #f87171\">{{ $reason }}<\/span>\r\n            <\/div>\r\n        <\/div>\r\n\r\n        <a href=\"mailto:{{ $supportEmail }}?subject=Buka%20Blokir%20{{ $referenceId }}\" class=\"btn\">\r\n            Hubungi Tim Keamanan IT\r\n        <\/a>\r\n\r\n        <div class=\"footer\">\r\n            Pusat Keamanan Siber &bullet; {{ config('app.name') }}\r\n        <\/div>\r\n    <\/div>\r\n<\/body>\r\n<\/html>\r\n```\r\n\r\n---\r\n\r\n## 2. Dashboard Monitoring Blade Murni Siap Pakai\r\n\r\nAnda tidak perlu membangun panel monitoring dari nol. Paket menyediakan halaman Blade siap pakai berbasis **Pure Vanilla CSS** yang dapat dipublikasikan dengan satu perintah:\r\n\r\n```bash\r\nphp artisan pasak:install --with-dashboard\r\n# atau: php artisan vendor:publish --tag=plain-views\r\n```\r\n\r\nPerintah tersebut menyalin berkas berikut ke aplikasi Anda:\r\n\r\n| Berkas yang Dipublikasikan                             | Deskripsi                                                   |\r\n| :----------------------------------------------------- | :---------------------------------------------------------- |\r\n| `resources\/views\/pages\/pasak\/overview.blade.php`    | Statistik, tren serangan, dan kartu top attacker 24 jam real-time. |\r\n| `resources\/views\/pages\/pasak\/threat-map.blade.php`  | Peta geografis lintasan serangan dari asal penyerang menuju server (live globe). |\r\n| `resources\/views\/pages\/pasak\/logs.blade.php`        | Data table log keamanan dengan filter rentang tanggal, pencarian, dan per-page. |\r\n| `resources\/views\/pages\/pasak\/log-detail.blade.php`  | Detail satu entri log: evidence, konteks request, dan log terkait. |\r\n| `resources\/views\/pages\/pasak\/blocked-ips.blade.php` | Data table karantina IP dengan filter tanggal, toggle status, dan buka blokir. |\r\n| `resources\/views\/pages\/pasak\/blocked-ip-detail.blade.php` | Detail satu blokir: alasan, log pemicu, dan tiket banding terkait. |\r\n| `resources\/views\/pages\/pasak\/allowed-ips.blade.php` | Data table daftar IP yang diizinkan (allowlist) dengan filter tanggal dan per-page. |\r\n| `resources\/views\/pages\/pasak\/server.blade.php`      | Audit integritas, pemindai webshell, baseline SHA-256, dan status sistem. |\r\n| `resources\/views\/pages\/pasak\/sessions.blade.php`    | Data table sesi pengguna aktif, riwayat login, dan IP terpercaya. |\r\n| `resources\/views\/pages\/pasak\/tickets.blade.php`     | Data table review permohonan tiket banding buka blokir. |\r\n| `resources\/views\/pages\/pasak\/ticket-detail.blade.php` | Detail satu tiket: alasan pemohon, blokir terkait, dan formulir respon. |\r\n| `resources\/views\/pages\/pasak\/settings.blade.php`    | Pengaturan WAF: ambang per tingkat, lingkup adaptif, lockout login, dan simulasi live. |\r\n| `resources\/views\/pages\/pasak\/pagination.blade.php`  | Komponen pagination terpadu: ringkasan entri dan tombol navigasi halaman. |\r\n| `resources\/views\/pages\/pasak\/layout.blade.php`      | Sub-layout navigasi, tema (Dark Mode), dan styling custom properties. |\r\n\r\nSetelah dipublikasikan, aktifkan dashboard melalui `.env`:\r\n\r\n```dotenv\r\nPASAK_DASHBOARD_ENABLED=true\r\nPASAK_DASHBOARD_PREFIX=pasak\r\n```\r\n\r\nPanel dapat diakses pada `\/pasak`. Halaman-halaman tersebut dirender controller bawaan paket sebagai Blade biasa.\r\n\r\n---\r\n\r\n### 3. Fitur Unggulan Dashboard Blade\r\n\r\n#### A. Data Table Interaktif (Filter Tanggal, Per-Page, & Pagination)\r\n\r\nSeluruh tabel data utama (`logs`, `blocked-ips`, `allowed-ips`, `sessions`, `tickets`) dilengkapi antarmuka Data Table modern:\r\n\r\n- **Filter Rentang Tanggal (`date_from` & `date_to`)**: Menyaring data berdasarkan tanggal kejadian dengan input tanggal visual dan tombol **Reset** untuk membersihkan saringan secara instan.\r\n- **Selector Entri Per Halaman**: Pilihan `10`, `25`, `50`, atau `100` entri per halaman dengan persistensi parameter URL otomatis saat berpindah halaman.\r\n- **Komponen Pagination Terpadu (`pagination.blade.php`)**: Menampilkan ringkasan informatif (*\"Showing X to Y of Z entries\"*) beserta tombol navigasi halaman responsif (*Previous*, nomor halaman berjenjang, dan *Next*).\r\n\r\n#### B. Threat Map — Peta Live Penyerang\r\n\r\nHalaman **Threat Map** (`\/pasak\/threat-map`) menampilkan bola dunia 3D interaktif yang memetakan lintasan serangan dari koordinat asal penyerang menuju server:\r\n\r\n- **Data Nyata & Warna Tingkat Ancaman**: Lintasan panah diambil dari `pasak_logs` 24 jam terakhir dengan warna sesuai tingkat bahaya (`critical` merah, `high` oranye, `medium` kuning, `low` hijau).\r\n- **Streaming Serangan Baru (`?after=`)**: Polling otomatis tiap 8 detik memanfaatkan kursor id terakhir sehingga hanya serangan baru yang digambar di globe tanpa memuat ulang log arsip lama.\r\n- **Mode Layar Penuh (Full Screen Mode)**: Tombol `⛶ Full screen` memperluas kanvas peta memenuhi layar secara fluid (`position: fixed; inset: 0`), dan tombol `Escape` mengembalikannya ke tampilan standar.\r\n- **Tata Letak Responsif Seluler**: Pada layar ponsel\/tablet, globe tetap tampil dominan di bagian atas dan metrik serangan ditata rapi dalam grid kartu.\r\n- **Pemberitahuan Anggun (Graceful Fallback)**: Jika CDN visualisasi tidak dapat dijangkau, antarmuka menyediakan kartu pemberitahuan yang informatif tanpa merusak panel log.\r\n\r\n#### C. Pengaturan Dinamis & Simulasi Live\r\n\r\nHalaman **Pengaturan** (`\/pasak\/settings`) memungkinkan pengelola menyetel:\r\n- Ambang batas auto-block per tingkat ancaman (`critical`, `high`, `medium`, `low`).\r\n- Lingkup pemblokiran: `device` (hanya perangkat pelanggar), `ip` (seluruh IP), atau `auto` (adaptif, aman untuk Wi-Fi kantor bersama).\r\n- Durasi pemblokiran bertingkat (6 jam hingga permanen).\r\n- Ambang batas proteksi login bertingkat (stepped lockout) dan masa simpan log.\r\n- **Kotak Simulasi Live**: Menguji skenario serangan secara interaktif untuk melihat apakah tindakan blokir akan terpicu berdasarkan pengaturan yang sedang aktif.\r\n\r\n---\r\n\r\n### 4. Desain Sistem Pure Vanilla CSS (Zero External UI Dependencies)\r\n\r\nStubs Blade dibangun menggunakan **Pure Vanilla CSS**:\r\n- **Tanpa dependensi frontend apa pun** (tanpa NPM, Node.js, Vite, Livewire, Inertia, Vue, ataupun UI kit eksternal).\r\n- Menanamkan CSS custom properties terisolasi (`--sec-*`) di dalam sub-layout (`layout.blade.php`) sehingga konsisten, ringan, dan kompatibel dengan tata letak apa pun.\r\n- Dilengkapi dukungan **Dark Mode** otomatis via media query `@media (prefers-color-scheme: dark)` dan kelas `.dark`, plus tombol toggle manual (Auto → Terang → Gelap) yang tersimpan di `localStorage`.\r\n- Sepenuhnya **responsif** dengan tabel scroll horizontal di layar sempit\/mobile serta grid fleksibel.\r\n\r\n---\r\n\r\n### 5. Menambahkan Tautan di Sidebar\r\n\r\nUntuk memunculkan tautan ke panel, tambahkan item berikut pada navigasi sidebar aplikasi Anda:\r\n\r\n```blade\r\n<flux:sidebar.item icon=\"shield-check\" :href=\"route('pasak.dashboard.overview')\" :current=\"request()->routeIs('pasak.dashboard.*')\" wire:navigate>\r\n    {{ __('Security Monitor') }}\r\n<\/flux:sidebar.item>\r\n```\r\n\r\nAtau jika menggunakan link HTML standar:\r\n\r\n```blade\r\n<a href=\"{{ route('pasak.dashboard.overview') }}\" wire:navigate class=\"nav-item\">\r\n    Security Monitor\r\n<\/a>\r\n```\r\n"},{"section":"07-integration-guides","filename":"03-custom-rules-and-whitelist.md","title":"03. Pembuatan Aturan Kustom & Whitelist Subnet","content":"# 03. Pembuatan Aturan Kustom & Whitelist Subnet\n\nSetiap aplikasi memiliki karakteristik lalu lintas data dan kebutuhan bisnis yang unik. Anda dapat memperluas aturan deteksi WAF bawaan dan mengonfigurasi pengecualian subnet (CIDR) secara fleksibel melalui `config\/pasak.php`.\n\n---\n\n## 1. Mendaftarkan Signature Zero-Tolerance Kustom\n\nJika aplikasi Anda memiliki endpoint khusus yang kerap diserang atau Anda ingin langsung memblokir percobaan pencarian berkas tertentu (misalnya probe terhadap `\/wp-login.php` atau `\/actuator\/health`), tambahkan ke array `instant_block.signatures` di `config\/pasak.php`:\n\n```php\n'instant_block' => [\n    'enabled' => true,\n    'duration_hours' => 720, \/\/ 30 hari\n    'signatures' => [\n        \/\/ Signature bawaan paket...\n\n        \/\/ Tambahkan aturan kustom Anda:\n        [\n            'id' => 'wordpress_probe_custom',\n            'label' => 'Percobaan probing CMS WordPress pada aplikasi non-WP',\n            'target' => 'path', \/\/ Hanya periksa URI path\n            'patterns' => [\n                '#^\/wp-(?:login|admin|content|includes)#i',\n                '#^\/xmlrpc\\.php#i',\n            ],\n        ],\n        [\n            'id' => 'spring_actuator_probe',\n            'label' => 'Percobaan akses Spring Boot Actuator',\n            'target' => 'path',\n            'patterns' => [\n                '#^\/actuator(?:\/.*)?$#i',\n            ],\n        ],\n    ],\n],\n```\n\n---\n\n## 2. Menambahkan Aturan WAF Reguler Kustom\n\nUntuk pola serangan yang ingin diakumulasikan ke dalam penilaian ambang batas bertingkat (auto-block 3 kali dalam 10 menit), tambahkan ke array `rules`:\n\n```php\n'rules' => [\n    \/\/ Aturan bawaan paket...\n\n    [\n        'id' => 'custom_log4j_jndi',\n        'label' => 'Indikasi Eksploitasi Log4j \/ JNDI Injection',\n        'level' => 'critical',\n        'patterns' => [\n            '\/\\$\\{jndi:(?:ldap|rmi|dns):\/i',\n        ],\n    ],\n],\n```\n\n---\n\n## 3. Whitelist Subnet Jaringan (CIDR) & Proxy Internal\n\nUntuk memastikan bahwa alamat IP jaringan kantor lokal, VPN kantor, atau subnet monitoring tidak akan pernah diblokir meskipun melakukan pengujian penetrasi:\n\n### Pada Berkas `.env`:\nPisahkan beberapa IP atau subnet dengan tanda koma:\n```dotenv\nPASAK_IP_WHITELIST=\"127.0.0.1,::1,192.168.1.0\/24,10.10.0.0\/16,103.11.22.33\"\n```\n\n### Logika Pemeriksaan Subnet:\nMetode `PasakService::isWhitelisted()` secara otomatis mendukung:\n1. **Pencocokan Alamat IPv4 \/ IPv6 Tunggal**: (misal `127.0.0.1`, `::1`).\n2. **Pencocokan Notasi CIDR Subnet**: (misal `192.168.1.0\/24` atau `10.0.0.0\/8`).\n3. **Pencocokan Wildcard Sederhana**: (misal `192.168.*.*`).\n4. **Pengecekan Admin Bypass**: Pengguna yang terotentikasi sebagai administrator sistem secara otomatis memiliki hak bypass dan tidak akan pernah diblokir saat menguji sistem.\n\n---\n\n## 4. Pengecualian Jalur URI (`exclude_paths`)\n\nJika ada rute webhook pihak ketiga (seperti Midtrans, Xendit, Stripe, atau integrasi API mitra) yang mengirimkan payload terenkripsi mentah atau payload yang mirip pola teks tertentu, daftarkan jalurnya di `exclude_paths`:\n\n```php\n'exclude_paths' => [\n    'api\/webhooks\/*',\n    'api\/payment-callback\/*',\n    'livewire\/upload-file',\n],\n```\nRequest yang cocok dengan pola di atas akan dilewati dari inspeksi konten body WAF untuk mencegah kesalahan deteksi (*false positive*).\r\n"},{"section":"07-integration-guides","filename":"04-custom-dashboard-dan-api-tanpa-ubah-vendor.md","title":"04. Panduan Kustomisasi Penuh (Full Custom Suite: Blade & REST API) Tanpa Mengubah Vendor","content":"# 04. Panduan Kustomisasi Penuh (Full Custom Suite: Blade & REST API) Tanpa Mengubah Vendor\r\n\r\nPaket **`pasak-dev\/secure-monitor`** dirancang mengikuti filosofi **Spatie-Standard & Headless Architecture**. Artinya, setelah paket dipasang melalui `composer require pasak-dev\/secure-monitor`, Anda memiliki kebebasan dan kendali 100% penuh untuk membuat tampilan monitoring kustom, alur kerja keamanan sendiri, maupun antarmuka REST API JSON tanpa pernah menyentuh atau merusak berkas inti paket di `vendor\/`.\r\n\r\nDokumen ini adalah cetak biru (*blueprint*) dan implementasi referensi resmi percontohan menyeluruh bagi pengembang yang ingin membangun dashboard Blade dan REST API kustom mencakup **seluruh 8 modul keamanan Pasak**.\r\n\r\n---\r\n\r\n## 1. Aturan Emas: Kebijakan Dilarang Mengubah Vendor (*Zero-Vendor-Edit Policy*)\r\n\r\n> ⚠️ **PERINGATAN KRUSIAL**:\r\n> **JANGAN PERNAH** memodifikasi, mengedit, atau menghapus berkas apapun di dalam folder `vendor\/pasak-dev\/secure-monitor\/`.\r\n> Segala perubahan di dalam folder `vendor\/` bersifat **sementara dan berbahaya**!\r\n\r\n### Mengapa Dilarang Mengubah Folder `vendor\/`?\r\n1. **Pembaruan Composer Menimpa Perubahan**: Setiap kali Anda menjalankan `composer update` atau men-deploy proyek ke server produksi via CI\/CD, Composer akan menghapus dan mengunduh ulang folder `vendor\/`. Seluruh modifikasi kustom yang Anda tulis di sana akan **hilang permanen**.\r\n2. **Integritas Deteksi & ReDoS Immunity**: Berkas regex WAF di `src\/Services\/PasakService.php` telah dirancang secara matematis untuk kebal terhadap serangan *Regular Expression Denial of Service* (ReDoS). Mengubah pola regex langsung di vendor dapat membuat server Anda lumpuh akibat *catastrophic backtracking*.\r\n3. **Integritas Signature & Baseline**: Modul server audit Pasak memeriksa SHA-256 dan integritas pustaka. Modifikasi internal akan memicu peringatan manipulasi berkas sistem.\r\n\r\n---\r\n\r\n## 2. Memahami Batas Wilayah: Apa yang Ada di `vendor\/` vs Aplikasi Anda\r\n\r\nKetika Anda menjalankan:\r\n```bash\r\ncomposer require pasak-dev\/secure-monitor\r\nphp artisan pasak:install\r\n```\r\n\r\nBerikut adalah pemisahan peran yang tegas antara pustaka inti dan aplikasi Anda:\r\n\r\n```text\r\nPROYEK LARAVEL ANDA\r\n├── app\/\r\n│   └── Http\/Controllers\/\r\n│       ├── KeamananController.php          <-- [ZONA ANDA] Controller Blade kustom (8 Modul)\r\n│       └── Api\/KeamananController.php      <-- [ZONA ANDA] REST API JSON kustom (8 Modul)\r\n├── config\/\r\n│   └── pasak.php                           <-- [ZONA ANDA] Konfigurasi aman diubah\r\n├── resources\/views\/\r\n│   ├── layouts\/app.blade.php               <-- [ZONA ANDA] Template induk aplikasi Anda\r\n│   ├── keamanan\/                           <-- [ZONA ANDA] Suite Tampilan Kustom Penuh:\r\n│   │   ├── _nav.blade.php                      (Komponen tab navigasi bersama)\r\n│   │   ├── index.blade.php                     (1. Ringkasan & Kartu Statistik)\r\n│   │   ├── logs.blade.php                      (2. Riwayat Log Ancaman & Filter)\r\n│   │   ├── blocked-ips.blade.php               (3. Isolasi IP & Device Quarantine)\r\n│   │   ├── allowed-ips.blade.php               (4. Whitelist IP & Jaringan CIDR)\r\n│   │   ├── server.blade.php                    (5. Audit Server & Integritas SHA-256)\r\n│   │   ├── sessions.blade.php                  (6. Sesi Pengguna & IP Terpercaya)\r\n│   │   ├── tickets.blade.php                   (7. Tiket Banding Permohonan Unblock)\r\n│   │   └── settings.blade.php                  (8. Pengaturan WAF Runtime Dinamis)\r\n├── routes\/\r\n│   ├── web.php                             <-- [ZONA ANDA] Rute web kustom (\/keamanan\/*)\r\n│   ├── api.php                             <-- [ZONA ANDA] Rute API kustom (\/api\/keamanan\/*)\r\n│   ├── pasak.php                           <-- [ZONA ANDA] Rute bawaan paket (bisa disesuaikan)\r\n│   └── pasak-api.php                       <-- [ZONA ANDA] Rute API bawaan paket\r\n│\r\n└── vendor\/pasak-dev\/secure-monitor\/                   <-- [ZONA DILINDUNGI \/ READ-ONLY]\r\n    ├── src\/                                    (Engine WAF, Service, Middleware, Model)\r\n    │   ├── Facades\/Pasak.php                   (Facade resmi untuk dipanggil aplikasi Anda)\r\n    │   ├── Services\/PasakService.php           (Mesin deteksi ancaman & inspeksi payload)\r\n    │   ├── Services\/PasakServerSecurityService.php (Engine audit server & baseline SHA-256)\r\n    │   ├── Http\/Middleware\/                    (Middleware pemblokir & penganalisis ancaman)\r\n    │   └── Models\/                             (Model Eloquent: PasakLog, PasakBlockedIp, dll.)\r\n    ├── database\/migrations\/                    (Definisi skema tabel migrasi)\r\n    └── stubs\/                                  (Template publikasi)\r\n```\r\n\r\n- **`vendor\/pasak-dev\/secure-monitor` (Zona Mesin \/ Engine)**: Layak dilihat hanya untuk referensi audit (*read-only*). Berisi logika inti WAF, parser header reverse-proxy, dan filter keamanan tingkat rendah.\r\n- **Aplikasi Host Anda (Zona Pengembang)**: Semua penyesuaian tampilan, rute, otorisasi, dan integrasi UI dilakukan di sini.\r\n\r\n---\r\n\r\n## 3. Komponen Inti yang Disediakan Paket untuk Kode Kustom Anda\r\n\r\nAplikasi Anda cukup memanggil komponen resmi berikut:\r\n\r\n| Komponen | Namespace \/ FQCN | Peran & Fungsi |\r\n|---|---|---|\r\n| **Facade Pasak** | `Pasak\\SecureMonitor\\Facades\\Pasak` | Akses statistik (`stats()`), cek blokir (`isBlocked()`), blokir IP (`blockIp()`), unblock (`unblockIp()`), runtime settings (`getSettings()`, `updateSettings()`). |\r\n| **Server Security Service** | `Pasak\\SecureMonitor\\Services\\PasakServerSecurityService` | Audit konfigurasi PHP\/DB\/Storage (`scan()`), buat baseline SHA-256 (`createBaseline()`), hapus berkas mencurigakan defensif (`deleteSuspiciousFile()`). |\r\n| **Model Log Ancaman** | `Pasak\\SecureMonitor\\Models\\PasakLog` | Query Eloquent ke riwayat ancaman WAF (`threat_level`, `ip_address`, `path`, `payload`). |\r\n| **Model IP Terblokir** | `Pasak\\SecureMonitor\\Models\\PasakBlockedIp` | Manajemen IP & device terisolasi (`ip_address`, `device_id`, `block_scope`, `is_active`). |\r\n| **Model Whitelist** | `Pasak\\SecureMonitor\\Models\\PasakAllowedIp` | Daftar pengecualian IP\/CIDR yang kebal deteksi WAF. |\r\n| **Model Percobaan Login** | `Pasak\\SecureMonitor\\Models\\PasakLoginAttempt` | Pelacakan mitigasi brute-force bertingkat (*stepped throttling*). |\r\n| **Model Sesi Pengguna** | `Pasak\\SecureMonitor\\Models\\PasakUserLogin` | Riwayat sesi aktif pengguna, heartbeat, dan data perangkat login. |\r\n| **Model IP Terpercaya** | `Pasak\\SecureMonitor\\Models\\PasakTrustedIp` | Alamat IP admin\/staf yang diverifikasi sah. |\r\n| **Model Tiket Banding** | `Pasak\\SecureMonitor\\Models\\PasakIpUnblockRequest` | Alur *self-service appeal* bagi pengguna yang terblokir tidak sengaja. |\r\n\r\n---\r\n\r\n## 4. Implementasi Penuh Web Controller Host (`app\/Http\/Controllers\/KeamananController.php`)\r\n\r\nBuat berkas kustom di dalam aplikasi host Anda:\r\n\r\n```php\r\n<?php\r\n\r\nnamespace App\\Http\\Controllers;\r\n\r\nuse Illuminate\\Http\\RedirectResponse;\r\nuse Illuminate\\Http\\Request;\r\nuse Illuminate\\View\\View;\r\nuse Pasak\\SecureMonitor\\Facades\\Pasak;\r\nuse Pasak\\SecureMonitor\\Models\\PasakAllowedIp;\r\nuse Pasak\\SecureMonitor\\Models\\PasakBlockedIp;\r\nuse Pasak\\SecureMonitor\\Models\\PasakIpUnblockRequest;\r\nuse Pasak\\SecureMonitor\\Models\\PasakLog;\r\nuse Pasak\\SecureMonitor\\Models\\PasakLoginAttempt;\r\nuse Pasak\\SecureMonitor\\Models\\PasakTrustedIp;\r\nuse Pasak\\SecureMonitor\\Models\\PasakUserLogin;\r\nuse Pasak\\SecureMonitor\\Services\\PasakServerSecurityService;\r\n\r\nclass KeamananController extends Controller\r\n{\r\n    \/\/ 1. OVERVIEW \/ RINGKASAN\r\n    public function index(Request $request): View\r\n    {\r\n        return view('keamanan.index', [\r\n            'stats' => Pasak::stats(),\r\n            'levelBreakdown' => Pasak::levelBreakdown(24),\r\n            'topAttackers' => Pasak::topAttackers(5),\r\n            'recentLogs' => PasakLog::query()->latest('id')->limit(8)->get(),\r\n            'recentBlocks' => PasakBlockedIp::query()->active()->latest('id')->limit(5)->get(),\r\n            'wafEnabled' => Pasak::isEnabled(),\r\n            'enforcementEnabled' => Pasak::isBlockEnforcementEnabled(),\r\n        ]);\r\n    }\r\n\r\n    \/\/ 2. LOG ANCAMAN WAF\r\n    public function logs(Request $request): View\r\n    {\r\n        $logs = PasakLog::query()\r\n            ->when($request->filled('level'), fn ($q) => $q->where('threat_level', $request->query('level')))\r\n            ->when($request->filled('search'), function ($query) use ($request) {\r\n                $search = $request->query('search');\r\n                $query->where(fn ($sub) => $sub->where('ip_address', 'like', \"%{$search}%\")\r\n                    ->orWhere('path', 'like', \"%{$search}%\")\r\n                    ->orWhere('rule_label', 'like', \"%{$search}%\"));\r\n            })\r\n            ->latest('id')\r\n            ->paginate(15)\r\n            ->withQueryString();\r\n\r\n        return view('keamanan.logs', [\r\n            'logs' => $logs,\r\n            'filterLevel' => $request->query('level', ''),\r\n            'filterSearch' => $request->query('search', ''),\r\n        ]);\r\n    }\r\n\r\n    public function destroyLog(int $id): RedirectResponse\r\n    {\r\n        PasakLog::destroy($id);\r\n        return back()->with('status', \"Log ancaman #{$id} berhasil dihapus.\");\r\n    }\r\n\r\n    public function clearLogs(): RedirectResponse\r\n    {\r\n        PasakLog::truncate();\r\n        return back()->with('status', 'Semua riwayat log ancaman WAF berhasil dibersihkan.');\r\n    }\r\n\r\n    \/\/ 3. IP DIBLOKIR & DEVICE QUARANTINE\r\n    public function blockedIps(Request $request): View\r\n    {\r\n        $blockedIps = PasakBlockedIp::query()\r\n            ->when($request->filled('search'), function ($q) use ($request) {\r\n                $search = $request->query('search');\r\n                $q->where(fn ($sub) => $sub->where('ip_address', 'like', \"%{$search}%\")\r\n                    ->orWhere('reason', 'like', \"%{$search}%\"));\r\n            })\r\n            ->latest('id')\r\n            ->paginate(15)\r\n            ->withQueryString();\r\n\r\n        return view('keamanan.blocked-ips', [\r\n            'blockedIps' => $blockedIps,\r\n            'filterSearch' => $request->query('search', ''),\r\n        ]);\r\n    }\r\n\r\n    public function blockIp(Request $request): RedirectResponse\r\n    {\r\n        $validated = $request->validate([\r\n            'ip' => ['required', 'ip'],\r\n            'reason' => ['nullable', 'string', 'max:255'],\r\n            'hours' => ['nullable', 'integer', 'min:1', 'max:8760'],\r\n            'scope' => ['nullable', 'string', 'in:ip,device'],\r\n        ]);\r\n\r\n        Pasak::blockIp(\r\n            ip: $validated['ip'],\r\n            reason: $validated['reason'] ?: 'Diblokir manual dari Dashboard Keamanan Kustom',\r\n            durationHours: ! empty($validated['hours']) ? (int) $validated['hours'] : null,\r\n            source: 'manual',\r\n            userId: $request->user()?->id ? (int) $request->user()->id : null,\r\n            scope: $validated['scope'] ?? 'ip'\r\n        );\r\n\r\n        return back()->with('status', \"IP {$validated['ip']} berhasil diblokir.\");\r\n    }\r\n\r\n    public function unblockIp(string $ip): RedirectResponse\r\n    {\r\n        Pasak::unblockIp($ip);\r\n        return back()->with('status', \"Blokir untuk IP {$ip} berhasil dibuka.\");\r\n    }\r\n\r\n    public function toggleBlockedIp(int $id): RedirectResponse\r\n    {\r\n        $item = PasakBlockedIp::findOrFail($id);\r\n        $item->update(['is_active' => ! $item->is_active]);\r\n        $status = $item->is_active ? 'diaktifkan kembali' : 'dinonaktifkan';\r\n\r\n        return back()->with('status', \"Status blokir untuk IP {$item->ip_address} berhasil {$status}.\");\r\n    }\r\n\r\n    public function destroyBlockedIp(int $id): RedirectResponse\r\n    {\r\n        $item = PasakBlockedIp::findOrFail($id);\r\n        $ip = $item->ip_address;\r\n        $item->delete();\r\n\r\n        return back()->with('status', \"Rekaman blokir IP {$ip} berhasil dihapus.\");\r\n    }\r\n\r\n    \/\/ 4. WHITELIST IP (ALLOWED IPS)\r\n    public function allowedIps(Request $request): View\r\n    {\r\n        $allowedIps = PasakAllowedIp::query()->latest('id')->paginate(15);\r\n        return view('keamanan.allowed-ips', ['allowedIps' => $allowedIps]);\r\n    }\r\n\r\n    public function storeAllowedIp(Request $request): RedirectResponse\r\n    {\r\n        $validated = $request->validate([\r\n            'ip_address' => ['required', 'string', 'max:50'],\r\n            'label' => ['nullable', 'string', 'max:100'],\r\n            'notes' => ['nullable', 'string', 'max:255'],\r\n        ]);\r\n\r\n        PasakAllowedIp::create([\r\n            'ip_address' => $validated['ip_address'],\r\n            'label' => $validated['label'] ?: 'Whitelist Manual',\r\n            'notes' => $validated['notes'] ?? null,\r\n            'is_active' => true,\r\n            'allowed_by' => $request->user()?->id,\r\n        ]);\r\n\r\n        return back()->with('status', \"IP \/ CIDR {$validated['ip_address']} berhasil ditambahkan ke whitelist.\");\r\n    }\r\n\r\n    public function toggleAllowedIp(int $id): RedirectResponse\r\n    {\r\n        $item = PasakAllowedIp::findOrFail($id);\r\n        $item->update(['is_active' => ! $item->is_active]);\r\n        $status = $item->is_active ? 'diaktifkan' : 'dinonaktifkan';\r\n\r\n        return back()->with('status', \"Whitelist {$item->ip_address} berhasil {$status}.\");\r\n    }\r\n\r\n    public function destroyAllowedIp(int $id): RedirectResponse\r\n    {\r\n        $item = PasakAllowedIp::findOrFail($id);\r\n        $item->delete();\r\n        return back()->with('status', 'Alamat whitelist berhasil dihapus.');\r\n    }\r\n\r\n    \/\/ 5. AUDIT SERVER & WEBSHELL SCANNER\r\n    public function server(Request $request, PasakServerSecurityService $service): View\r\n    {\r\n        $force = $request->boolean('refresh', false);\r\n        return view('keamanan.server', [\r\n            'report' => $service->scan($force),\r\n            'baseline' => $service->baselineSummary(),\r\n            'lockouts' => PasakLoginAttempt::query()->where('is_locked', true)->latest('id')->get(),\r\n        ]);\r\n    }\r\n\r\n    public function serverBaseline(PasakServerSecurityService $service): RedirectResponse\r\n    {\r\n        $result = $service->createBaseline();\r\n        $total = count($result['files'] ?? []);\r\n        return back()->with('status', \"Baseline SHA-256 berhasil dibuat ({$total} berkas dipindai).\");\r\n    }\r\n\r\n    public function serverBaselineDestroy(PasakServerSecurityService $service): RedirectResponse\r\n    {\r\n        $service->deleteBaseline();\r\n        return back()->with('status', 'Baseline SHA-256 berhasil dihapus.');\r\n    }\r\n\r\n    public function deleteSuspiciousFile(Request $request, PasakServerSecurityService $service): RedirectResponse\r\n    {\r\n        $request->validate(['path' => ['required', 'string']]);\r\n        $res = $service->deleteSuspiciousFile($request->input('path'));\r\n        if ($res['success']) {\r\n            return back()->with('status', \"Berkas mencurigakan '{$request->input('path')}' berhasil dimusnahkan.\");\r\n        }\r\n        return back()->withErrors(['err' => $res['message'] ?? 'Gagal menghapus berkas.']);\r\n    }\r\n\r\n    public function releaseLockout(int $id): RedirectResponse\r\n    {\r\n        PasakLoginAttempt::where('id', $id)->delete();\r\n        return back()->with('status', 'Kunci akun login berhasil dibuka kembali.');\r\n    }\r\n\r\n    \/\/ 6. SESI LOGIN PENGGUNA & IP TERPERCAYA\r\n    public function sessions(Request $request): View\r\n    {\r\n        return view('keamanan.sessions', [\r\n            'sessions' => PasakUserLogin::query()->latest('id')->paginate(15),\r\n            'trustedIps' => PasakTrustedIp::query()->latest('id')->get(),\r\n        ]);\r\n    }\r\n\r\n    public function destroySession(int $id): RedirectResponse\r\n    {\r\n        $session = PasakUserLogin::findOrFail($id);\r\n        $session->update(['logout_at' => now()]);\r\n        return back()->with('status', \"Sesi pengguna #{$id} berhasil diputus.\");\r\n    }\r\n\r\n    public function storeTrustedIp(Request $request): RedirectResponse\r\n    {\r\n        $ip = $request->ip() ?: '127.0.0.1';\r\n        PasakTrustedIp::firstOrCreate([\r\n            'user_id' => $request->user()?->id,\r\n            'ip_address' => $ip,\r\n        ], [\r\n            'device_name' => substr((string) $request->userAgent(), 0, 100),\r\n        ]);\r\n\r\n        return back()->with('status', \"Alamat IP Anda ({$ip}) berhasil ditandai sebagai IP Terpercaya.\");\r\n    }\r\n\r\n    public function destroyTrustedIp(int $id): RedirectResponse\r\n    {\r\n        PasakTrustedIp::destroy($id);\r\n        return back()->with('status', 'IP Terpercaya berhasil dihapus.');\r\n    }\r\n\r\n    \/\/ 7. TIKET PERMOHONAN BANDING UNBLOCK\r\n    public function tickets(Request $request): View\r\n    {\r\n        $tickets = PasakIpUnblockRequest::query()\r\n            ->when($request->filled('status'), fn ($q) => $q->where('status', $request->query('status')))\r\n            ->latest('id')\r\n            ->paginate(15)\r\n            ->withQueryString();\r\n\r\n        return view('keamanan.tickets', [\r\n            'tickets' => $tickets,\r\n            'filterStatus' => $request->query('status', ''),\r\n        ]);\r\n    }\r\n\r\n    public function respondTicket(Request $request, int $id): RedirectResponse\r\n    {\r\n        $validated = $request->validate([\r\n            'status' => ['required', 'in:approved,rejected'],\r\n            'admin_notes' => ['nullable', 'string', 'max:500'],\r\n        ]);\r\n\r\n        $ticket = PasakIpUnblockRequest::findOrFail($id);\r\n        $ticket->update([\r\n            'status' => $validated['status'],\r\n            'admin_notes' => $validated['admin_notes'] ?? null,\r\n            'resolved_by' => $request->user()?->id,\r\n            'resolved_at' => now(),\r\n        ]);\r\n\r\n        if ($validated['status'] === 'approved') {\r\n            Pasak::unblockIp($ticket->ip_address, $ticket->device_id);\r\n        }\r\n\r\n        $action = $validated['status'] === 'approved' ? 'disetujui dan blokir telah dibuka' : 'ditolak';\r\n        return back()->with('status', \"Tiket permohonan #{$ticket->ticket_number} berhasil {$action}.\");\r\n    }\r\n\r\n    public function destroyTicket(int $id): RedirectResponse\r\n    {\r\n        PasakIpUnblockRequest::destroy($id);\r\n        return back()->with('status', 'Tiket permohonan berhasil dihapus.');\r\n    }\r\n\r\n    \/\/ 8. PENGATURAN WAF DINAMIS\r\n    public function settings(Request $request): View\r\n    {\r\n        return view('keamanan.settings', ['settings' => Pasak::getSettings()]);\r\n    }\r\n\r\n    public function updateSettings(Request $request): RedirectResponse\r\n    {\r\n        $validated = $request->validate([\r\n            'auto_block_scope' => ['nullable', 'string', 'in:device,ip,auto'],\r\n            'auto_block_enabled' => ['nullable', 'boolean'],\r\n            'auto_block_threshold' => ['nullable', 'integer', 'min:1', 'max:100'],\r\n            'auto_block_duration' => ['nullable', 'integer', 'min:0', 'max:8760'],\r\n            'instant_block_enabled' => ['nullable', 'boolean'],\r\n            'block_enforcement' => ['nullable', 'boolean'],\r\n        ]);\r\n\r\n        Pasak::updateSettings($validated);\r\n        return back()->with('status', 'Pengaturan WAF berhasil diperbarui.');\r\n    }\r\n}\r\n```\r\n\r\n---\r\n\r\n## 5. Implementasi Penuh REST API Controller Host (`app\/Http\/Controllers\/Api\/KeamananController.php`)\r\n\r\nUntuk integrasi ke aplikasi mobile (Flutter\/React Native), antarmuka Next.js\/Nuxt.js, atau sistem pemantauan eksternal:\r\n\r\n```php\r\n<?php\r\n\r\nnamespace App\\Http\\Controllers\\Api;\r\n\r\nuse App\\Http\\Controllers\\Controller;\r\nuse Illuminate\\Http\\JsonResponse;\r\nuse Illuminate\\Http\\Request;\r\nuse Pasak\\SecureMonitor\\Facades\\Pasak;\r\nuse Pasak\\SecureMonitor\\Models\\PasakAllowedIp;\r\nuse Pasak\\SecureMonitor\\Models\\PasakBlockedIp;\r\nuse Pasak\\SecureMonitor\\Models\\PasakIpUnblockRequest;\r\nuse Pasak\\SecureMonitor\\Models\\PasakLog;\r\nuse Pasak\\SecureMonitor\\Models\\PasakLoginAttempt;\r\nuse Pasak\\SecureMonitor\\Models\\PasakTrustedIp;\r\nuse Pasak\\SecureMonitor\\Models\\PasakUserLogin;\r\nuse Pasak\\SecureMonitor\\Services\\PasakServerSecurityService;\r\n\r\nclass KeamananController extends Controller\r\n{\r\n    \/\/ 1. Overview\r\n    public function index(): JsonResponse\r\n    {\r\n        return response()->json([\r\n            'success' => true,\r\n            'message' => 'Status dan statistik operasional WAF.',\r\n            'data' => [\r\n                'waf' => [\r\n                    'enabled' => Pasak::isEnabled(),\r\n                    'block_enforcement' => Pasak::isBlockEnforcementEnabled(),\r\n                ],\r\n                'stats' => Pasak::stats(),\r\n                'level_breakdown' => Pasak::levelBreakdown(24),\r\n                'top_attackers' => Pasak::topAttackers(5),\r\n            ],\r\n        ]);\r\n    }\r\n\r\n    \/\/ 2. Logs\r\n    public function logs(Request $request): JsonResponse\r\n    {\r\n        $logs = PasakLog::query()\r\n            ->when($request->query('level'), fn ($q, $l) => $q->where('threat_level', $l))\r\n            ->latest('id')\r\n            ->paginate($request->integer('per_page', 20));\r\n\r\n        return response()->json(['success' => true, 'data' => $logs]);\r\n    }\r\n\r\n    public function clearLogs(): JsonResponse\r\n    {\r\n        PasakLog::truncate();\r\n        return response()->json(['success' => true, 'message' => 'Semua riwayat log ancaman WAF berhasil dibersihkan.']);\r\n    }\r\n\r\n    \/\/ 3. Blocked IPs\r\n    public function blockedIps(): JsonResponse\r\n    {\r\n        $items = PasakBlockedIp::query()->active()->latest('id')->get();\r\n        return response()->json(['success' => true, 'count' => $items->count(), 'data' => $items]);\r\n    }\r\n\r\n    public function checkIp(string $ip): JsonResponse\r\n    {\r\n        return response()->json([\r\n            'success' => true,\r\n            'data' => ['ip_address' => $ip, 'is_blocked' => Pasak::isBlocked($ip)],\r\n        ]);\r\n    }\r\n\r\n    public function blockIp(Request $request): JsonResponse\r\n    {\r\n        $validated = $request->validate([\r\n            'ip' => ['required', 'ip'],\r\n            'reason' => ['nullable', 'string', 'max:255'],\r\n            'hours' => ['nullable', 'integer', 'min:1'],\r\n            'scope' => ['nullable', 'string', 'in:ip,device'],\r\n        ]);\r\n\r\n        Pasak::blockIp(\r\n            ip: $validated['ip'],\r\n            reason: $validated['reason'] ?? 'Diblokir manual via REST API',\r\n            durationHours: ! empty($validated['hours']) ? (int) $validated['hours'] : null,\r\n            source: 'api',\r\n            userId: $request->user()?->id ? (int) $request->user()->id : null,\r\n            scope: $validated['scope'] ?? 'ip'\r\n        );\r\n\r\n        return response()->json(['success' => true, 'message' => \"IP {$validated['ip']} berhasil diblokir.\"], 201);\r\n    }\r\n\r\n    public function unblockIp(string $ip): JsonResponse\r\n    {\r\n        $unblocked = Pasak::unblockIp($ip);\r\n        return response()->json([\r\n            'success' => true,\r\n            'message' => $unblocked ? \"Blokir untuk IP {$ip} berhasil dibuka.\" : 'IP tidak ditemukan.',\r\n            'data' => ['is_blocked' => Pasak::isBlocked($ip)],\r\n        ]);\r\n    }\r\n\r\n    \/\/ 4. Allowed IPs (Whitelist)\r\n    public function allowedIps(): JsonResponse\r\n    {\r\n        $items = PasakAllowedIp::query()->latest('id')->get();\r\n        return response()->json(['success' => true, 'count' => $items->count(), 'data' => $items]);\r\n    }\r\n\r\n    public function storeAllowedIp(Request $request): JsonResponse\r\n    {\r\n        $validated = $request->validate([\r\n            'ip_address' => ['required', 'string', 'max:50'],\r\n            'label' => ['nullable', 'string', 'max:100'],\r\n            'notes' => ['nullable', 'string', 'max:255'],\r\n        ]);\r\n\r\n        $item = PasakAllowedIp::create([\r\n            'ip_address' => $validated['ip_address'],\r\n            'label' => $validated['label'] ?: 'Whitelist API',\r\n            'notes' => $validated['notes'] ?? null,\r\n            'is_active' => true,\r\n            'allowed_by' => $request->user()?->id,\r\n        ]);\r\n\r\n        return response()->json(['success' => true, 'message' => \"IP {$item->ip_address} ditambahkan ke whitelist.\", 'data' => $item], 201);\r\n    }\r\n\r\n    public function destroyAllowedIp(int $id): JsonResponse\r\n    {\r\n        PasakAllowedIp::destroy($id);\r\n        return response()->json(['success' => true, 'message' => \"Whitelist #{$id} berhasil dihapus.\"]);\r\n    }\r\n\r\n    \/\/ 5. Server Security\r\n    public function serverReport(Request $request, PasakServerSecurityService $service): JsonResponse\r\n    {\r\n        $force = $request->boolean('refresh', false);\r\n        return response()->json([\r\n            'success' => true,\r\n            'data' => [\r\n                'report' => $service->scan($force),\r\n                'baseline' => $service->baselineSummary(),\r\n            ],\r\n        ]);\r\n    }\r\n\r\n    public function createBaseline(PasakServerSecurityService $service): JsonResponse\r\n    {\r\n        $result = $service->createBaseline();\r\n        return response()->json([\r\n            'success' => true,\r\n            'message' => 'Baseline integritas SHA-256 berhasil dibuat.',\r\n            'data' => [\r\n                'total_files' => count($result['files'] ?? []),\r\n                'created_at' => $result['created_at'] ?? now()->toIso8601String(),\r\n                'files' => $result['files'] ?? [],\r\n            ],\r\n        ], 201);\r\n    }\r\n\r\n    \/\/ 6. User Sessions & Trusted IPs\r\n    public function sessions(): JsonResponse\r\n    {\r\n        return response()->json([\r\n            'success' => true,\r\n            'data' => [\r\n                'sessions' => PasakUserLogin::query()->latest('id')->limit(50)->get(),\r\n                'trusted_ips' => PasakTrustedIp::query()->latest('id')->get(),\r\n            ],\r\n        ]);\r\n    }\r\n\r\n    public function storeTrustedIp(Request $request): JsonResponse\r\n    {\r\n        $ip = $request->ip() ?: '127.0.0.1';\r\n        $trusted = PasakTrustedIp::firstOrCreate([\r\n            'user_id' => $request->user()?->id,\r\n            'ip_address' => $ip,\r\n        ], [\r\n            'device_name' => substr((string) $request->userAgent(), 0, 100),\r\n        ]);\r\n\r\n        return response()->json(['success' => true, 'message' => \"IP {$ip} disimpan sebagai IP terpercaya.\", 'data' => $trusted], 201);\r\n    }\r\n\r\n    \/\/ 7. Tickets\r\n    public function tickets(Request $request): JsonResponse\r\n    {\r\n        $tickets = PasakIpUnblockRequest::query()\r\n            ->when($request->query('status'), fn ($q, $s) => $q->where('status', $s))\r\n            ->latest('id')\r\n            ->paginate(15);\r\n\r\n        return response()->json(['success' => true, 'data' => $tickets]);\r\n    }\r\n\r\n    public function respondTicket(Request $request, int $id): JsonResponse\r\n    {\r\n        $validated = $request->validate([\r\n            'status' => ['required', 'in:approved,rejected'],\r\n            'admin_notes' => ['nullable', 'string', 'max:500'],\r\n        ]);\r\n\r\n        $ticket = PasakIpUnblockRequest::findOrFail($id);\r\n        $ticket->update([\r\n            'status' => $validated['status'],\r\n            'admin_notes' => $validated['admin_notes'] ?? null,\r\n            'resolved_by' => $request->user()?->id,\r\n            'resolved_at' => now(),\r\n        ]);\r\n\r\n        if ($validated['status'] === 'approved') {\r\n            Pasak::unblockIp($ticket->ip_address, $ticket->device_id);\r\n        }\r\n\r\n        return response()->json(['success' => true, 'message' => \"Tiket #{$ticket->ticket_number} diperbarui.\", 'data' => $ticket]);\r\n    }\r\n\r\n    \/\/ 8. Settings\r\n    public function settings(): JsonResponse\r\n    {\r\n        return response()->json(['success' => true, 'data' => Pasak::getSettings()]);\r\n    }\r\n\r\n    public function updateSettings(Request $request): JsonResponse\r\n    {\r\n        $validated = $request->validate([\r\n            'auto_block_scope' => ['nullable', 'string', 'in:device,ip,auto'],\r\n            'auto_block_enabled' => ['nullable', 'boolean'],\r\n            'auto_block_threshold' => ['nullable', 'integer', 'min:1', 'max:100'],\r\n            'auto_block_duration' => ['nullable', 'integer', 'min:0', 'max:8760'],\r\n            'instant_block_enabled' => ['nullable', 'boolean'],\r\n            'block_enforcement' => ['nullable', 'boolean'],\r\n        ]);\r\n\r\n        $updated = Pasak::updateSettings($validated);\r\n        return response()->json(['success' => true, 'message' => 'Pengaturan WAF berhasil diperbarui.', 'data' => $updated]);\r\n    }\r\n}\r\n```\r\n\r\n---\r\n\r\n## 6. Mendaftarkan Rute di Aplikasi Host\r\n\r\n### Rute Web (`routes\/web.php`)\r\n```php\r\nuse App\\Http\\Controllers\\KeamananController;\r\n\r\nRoute::middleware('auth')->prefix('kea \r\n```\r\n\r\nHasil: **100% Pass** dengan integritas penuh tanpa pernah menyentuh satu baris kode pun di dalam `vendor\/`!\r\n"}];
        let currentIndex = 0;

        function sectionLabel(section) {
            return section.replace(/^\d+-/, '').replace(/-/g, ' ').toUpperCase();
        }

        function buildNav() {
            const nav = document.getElementById('navTree');
            nav.innerHTML = '';

            let currentSection = '';
            let list = null;

            docsData.forEach((doc, idx) => {
                if (doc.section !== currentSection) {
                    currentSection = doc.section;

                    const heading = document.createElement('div');
                    heading.className = 'mb-1 mt-4 px-2 text-[11px] font-extrabold uppercase tracking-wider text-slate-400';
                    heading.textContent = sectionLabel(currentSection);
                    nav.appendChild(heading);

                    list = document.createElement('ul');
                    list.className = 'space-y-0.5';
                    nav.appendChild(list);
                }

                const li = document.createElement('li');
                const a = document.createElement('a');
                a.className = 'nav-link block cursor-pointer truncate rounded-lg px-3 py-2 text-sm font-medium text-slate-500 transition hover:bg-slate-100 hover:text-slate-900 dark:text-slate-400 dark:hover:bg-slate-800 dark:hover:text-white';
                a.dataset.index = String(idx);
                a.textContent = doc.title;
                a.onclick = () => loadDoc(idx);
                li.appendChild(a);
                list.appendChild(li);
            });
        }

        function setActive(index) {
            document.querySelectorAll('.nav-link').forEach((el) => {
                const active = Number(el.dataset.index) === index;
                el.classList.toggle('bg-sky-400/10', active);
                el.classList.toggle('text-sky-600', active);
                el.classList.toggle('dark:text-sky-300', active);
                el.classList.toggle('font-bold', active);
            });
        }

        function renderMermaid(article) {
            article.querySelectorAll('pre > code.language-mermaid, pre > code.lang-mermaid').forEach((code) => {
                const div = document.createElement('div');
                div.className = 'mermaid not-prose my-6 flex justify-center';
                div.textContent = code.textContent;
                code.parentElement.replaceWith(div);
            });
        }

        function attachCopyButtons(article) {
            article.querySelectorAll('pre').forEach((pre) => {
                pre.classList.add('relative');

                const btn = document.createElement('button');
                btn.className = 'copy-btn absolute right-3 top-3 rounded-md border border-slate-700 bg-slate-800/80 px-2.5 py-1 text-[11px] font-semibold text-slate-300 transition hover:bg-sky-600 hover:text-white';
                btn.textContent = 'Salin';
                btn.onclick = () => {
                    const code = pre.querySelector('code') ? pre.querySelector('code').innerText : pre.innerText;
                    navigator.clipboard.writeText(code).then(() => {
                        btn.textContent = 'Tersalin! ✓';
                        setTimeout(() => { btn.textContent = 'Salin'; }, 1800);
                    });
                };

                pre.appendChild(btn);
            });
        }

        async function loadDoc(index) {
            const doc = docsData[index];
            if (!doc) { return; }

            currentIndex = index;
            setActive(index);
            document.getElementById('activeBreadcrumb').textContent = doc.title;

            const article = document.getElementById('articleContent');
            article.innerHTML = window.marked ? marked.parse(doc.content) : doc.content;

            renderMermaid(article);
            attachCopyButtons(article);

            if (window.mermaid) {
                try {
                    await mermaid.run({ nodes: article.querySelectorAll('.mermaid') });
                } catch (error) {
                    console.warn('Mermaid render skipped:', error);
                }
            }

            window.scrollTo({ top: 0, behavior: 'smooth' });
            closeSidebar();
        }

        function handleSearch(query) {
            const q = query.toLowerCase().trim();
            document.querySelectorAll('#navTree .nav-link').forEach((el) => {
                const match = el.textContent.toLowerCase().includes(q);
                el.parentElement.style.display = match ? '' : 'none';
            });
        }

        function toggleTheme() {
            const dark = document.documentElement.classList.toggle('dark');
            localStorage.setItem('bulwark-theme', dark ? 'dark' : 'light');

            if (window.mermaid) {
                mermaid.initialize({ startOnLoad: false, theme: dark ? 'dark' : 'default', securityLevel: 'loose' });
            }

            loadDoc(currentIndex);
        }

        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const backdrop = document.getElementById('backdrop');
            const hidden = sidebar.classList.toggle('-translate-x-full');
            backdrop.classList.toggle('hidden', hidden);
        }

        function closeSidebar() {
            if (window.innerWidth < 768) {
                document.getElementById('sidebar').classList.add('-translate-x-full');
                document.getElementById('backdrop').classList.add('hidden');
            }
        }

        (function initTheme() {
            const saved = localStorage.getItem('bulwark-theme');
            const dark = saved ? saved === 'dark' : true;
            document.documentElement.classList.toggle('dark', dark);
        })();

        if (window.mermaid) {
            mermaid.initialize({
                startOnLoad: false,
                securityLevel: 'loose',
                theme: document.documentElement.classList.contains('dark') ? 'dark' : 'default',
            });
        }

        buildNav();
        loadDoc(0);
    </script>
